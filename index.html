<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pageant Answer Studio</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #11151a;
    --panel-2: #171c22;
    --panel-3: #1d232b;
    --border: #2a313a;
    --text: #f6f7f9;
    --muted: #9ba6b2;
    --accent: #00ac81;
    --accent-soft: rgba(0,172,129,.12);
    --accent-border: rgba(0,172,129,.38);
    --danger: #ff6b6b;
    --shadow: 0 18px 50px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  button, input { font: inherit; }

  .app { min-height: 100vh; }

  aside, .categories, .brand, .topbar .status-row { display: none; }

  .brand {
    padding: 26px 24px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand .eyebrow {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .brand h1 {
    margin: 0;
    font-size: 21px;
    letter-spacing: -.02em;
  }
  .brand p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .categories {
    padding: 18px 14px;
    overflow-y: auto;
  }
  .category-title {
    color: #6f7b87;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    padding: 0 10px 10px;
    font-weight: 800;
  }
  .category-btn {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: #c5cbd2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    padding: 10px 11px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 5px;
    transition: .15s ease;
  }
  .category-btn:hover {
    background: var(--panel-2);
    color: var(--text);
  }
  .category-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent-border);
    color: #ddfff5;
  }
  .count {
    min-width: 28px;
    text-align: center;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    color: var(--muted);
    font-size: 11px;
  }
  .category-btn.active .count {
    background: rgba(0,172,129,.18);
    color: #8ff0d5;
  }

  main { min-height: 100vh; }

  .topbar { padding: 30px 24px 10px; }

  .controls { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .field { flex: 1; }
  .field label { display: none; }
  .input {
    width: 100%;
    height: 56px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 0 24px;
    font-size: 16px;
    outline: none;
    transition: .15s ease;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,172,129,.12);
  }
  .clear-btn {
    width: 56px;
    height: 56px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel);
    color: #cfd6dd;
    padding: 0;
    font-size: 20px;
    cursor: pointer;
  }
  .clear-btn:hover { background: var(--panel-2); }

  .status-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
  }
  .status-row strong { color: #dce1e7; }
  .kbd {
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }
  .kbd span {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    padding: 2px 6px;
    color: #c0c7cf;
  }

  .content { padding: 42px 24px 64px; }

  .results { max-width: 760px; margin: 0 auto; }

  .card {
    background: linear-gradient(180deg, #12161b 0%, #101419 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    padding: 28px 30px 24px;
    border-bottom: 1px solid var(--border);
  }
  .meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 9px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--accent-border);
    background: var(--accent-soft);
    color: #8ce8d0;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .topic {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .question {
    font-size: clamp(21px, 3vw, 30px);
    line-height: 1.35;
    font-weight: 760;
    letter-spacing: -.015em;
  }

  .sentences { padding: 12px 18px; }
  .sentence-row {
    display: grid;
    grid-template-columns: 34px 1fr 42px;
    gap: 10px;
    align-items: center;
    padding: 15px 10px;
    border-radius: 12px;
  }
  .sentence-row:hover { background: var(--panel-2); }
  .num {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: #d5dbe1;
    font-size: 12px;
    font-weight: 800;
  }
  .sentence {
    color: #e7ebef;
    line-height: 1.55;
    font-size: 16px;
  }
  .copy-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: #12171c;
    color: #cbd2d8;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .copy-btn:hover {
    border-color: var(--accent-border);
    color: #a8f3df;
    background: var(--accent-soft);
  }
  .copy-btn.copied {
    border-color: var(--accent);
    background: var(--accent);
    color: #04120e;
  }

  .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 30px 24px; }
  .copy-all {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 0;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
  }
  .copy-all:hover { color: #bdf6e6; }

  .nav { display: flex; align-items: center; gap: 10px; }
  .position { color: var(--muted); font-size: 12px; min-width: 50px; text-align: right; }
  .next-btn, .prev-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 21px;
  }
  .next-btn:hover, .prev-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .next-btn:disabled, .prev-btn:disabled { opacity: .28; cursor: default; }
  .hint { color: var(--muted); text-align: center; font-size: 13px; margin-top: 18px; }

  .settings {
    display: none; max-width: 760px; margin: 12px auto 0; padding: 18px 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  }
  .settings.open { display: block; }
  .settings label { display: block; color: var(--text); font-size: 13px; font-weight: 750; margin-bottom: 9px; }
  .settings p { color: var(--muted); font-size: 12px; margin: 9px 3px 0; }
  .settings .input { border-radius: 10px; height: 44px; padding: 0 13px; font-size: 14px; }
  .search-icon { margin-right: -54px; z-index: 1; color: var(--muted); pointer-events: none; }
  .controls .input { padding-left: 52px; }

  .empty {
    grid-column: 1 / -1;
    border: 1px dashed var(--border);
    background: var(--panel);
    border-radius: 16px;
    padding: 46px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 8px;
    font-size: 18px;
  }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: #e9fff8;
    color: #062219;
    border: 1px solid rgba(0,172,129,.45);
    border-radius: 11px;
    padding: 11px 14px;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 14px 40px rgba(0,0,0,.35);
    transform: translateY(18px);
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  mark {
    background: rgba(0,172,129,.22);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }

  @media (max-width: 620px) {
    .topbar { padding: 18px 14px 8px; }
    .content { padding: 28px 14px 40px; }
    .card-head { padding: 22px 20px 18px; }
    .sentences { padding: 8px; }
    .sentence-row { grid-template-columns: 30px 1fr 38px; gap: 8px; }
    .sentence { font-size: 14px; }
    .card-footer { padding: 8px 18px 20px; }
  }
  .sentence { white-space: pre-wrap; }
  .timer { position: fixed; top: 12px; right: 18px; z-index: 5; background: #171c22; color: #8ce8d0; border: 2px solid #2a313a; border-radius: 16px; padding: 14px 24px; min-width: 164px; font-size: 40px; font-weight: 800; cursor: pointer; font-variant-numeric: tabular-nums; box-shadow: 0 8px 28px #0005; }
  .timer.urgent { color: #ff9898; border-color: #ff6b6b; }
  .topbar { padding-top: 116px; }
  @media(max-width: 620px) { .timer { font-size: 32px; min-width: 136px; padding: 10px 16px; } .topbar { padding-top: 96px; } }
  .content { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 760px) minmax(180px, 240px); gap: 24px; justify-content: center; align-items: start; }
  .results { grid-column: 2; grid-row: 1; width: 100%; }
  .quick-lines { display: contents; }
  .quick-lines > div:first-child { grid-column: 1; grid-row: 1 / span 3; }
  .quick-lines > div:last-child { grid-column: 3; grid-row: 1 / span 3; }
  .extenders { grid-column: 2; grid-row: 2; min-width: 0; }
  .extenders h2 { color: var(--muted); font-size: 14px; font-weight: 600; }
  .content > .speech-toggle { grid-column: 2; grid-row: 3; margin: 0; }
  .content > .final-speeches { grid-column: 2; grid-row: 4; margin: 0; width: 100%; }
  .quick-lines h2 { font-size: 13px; color: var(--muted); font-weight: 600; }
  .phrase { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 13px 15px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; line-height: 1.5; }
  .phrase:hover { border-color: var(--accent); background: var(--accent-soft); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media(max-width: 900px) {
    .content { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .results { grid-column: 1 / -1; grid-row: 1; }
    .quick-lines > div:first-child { grid-column: 1; grid-row: 2; }
    .quick-lines > div:last-child { grid-column: 2; grid-row: 2; }
    .extenders { grid-column: 1 / -1; grid-row: 3; }
    .content > .speech-toggle { grid-column: 1 / -1; grid-row: 4; }
    .content > .final-speeches { grid-column: 1 / -1; grid-row: 5; }
  }
  .final-speeches { max-width: 760px; margin: 32px auto 0; }
  .final-speeches[hidden] { display: none; }
  .speech-toggle { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 28px auto 0; cursor: pointer; color: var(--muted); font-size: 14px; }
  .speech-toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .speech-option { margin-bottom: 22px; }
  .speech-option h3 { font-size: 14px; font-weight: 600; color: var(--accent); }
  .final-speeches h2 { font-size: 16px; margin-bottom: 6px; }
  .final-speeches p { color: var(--muted); font-size: 13px; }
  .speech-label { display: block; color: var(--accent); font-size: 12px; margin-bottom: 10px; }
  .speech-line { display: block; white-space: pre-wrap; }
  .speech-line + .speech-line { margin-top: 10px; }
</style>
</head>
<body>
<button class="timer" id="timer" hidden title="Restart the 100 second timer" aria-label="Restart timer">100s ↻</button>
<div class="app">
  <main>
    <div class="topbar">
      <div class="controls">
        <span class="search-icon">⌕</span>
        <div class="field">
          <label for="search">Search question, topic, keyword or answer</label>
          <input class="input" id="search" type="text" placeholder="Search any topic: war, confidence, education..." autocomplete="off" autofocus>
        </div>
        <button class="clear-btn" id="settingsButton" aria-label="Settings" title="Settings">⚙</button>
      </div>
      <div class="settings" id="settingsPanel">
        <label for="contest">Pageant name</label>
        <input class="input" id="contest" type="text" value="Miss Universe" placeholder="Miss Universe">
        <p>The pageant name is automatically replaced throughout relevant answers.</p>
        <label style="display:flex;align-items:center;gap:10px;margin-top:20px;cursor:pointer" for="copyAllCaps">
          <input id="copyAllCaps" type="checkbox" style="width:20px;height:20px;accent-color:var(--accent)">
          Copy in ALL CAPS
        </label>
        <p>Applies to everything you copy, keeps the text on screen unchanged</p>
      </div>
    </div>

    <div class="content">
      <div class="results" id="results"></div>
      <section class="quick-lines" id="quickLines" aria-label="Copy an opening or closing"></section>
      <section class="extenders" id="extenders" aria-label="Extenders"></section>
      <label class="speech-toggle" for="showFinalSpeeches"><input type="checkbox" id="showFinalSpeeches" aria-controls="finalSpeeches" aria-expanded="false">Show final speeches</label>
      <section class="final-speeches" id="finalSpeeches" aria-label="Final speeches" hidden></section>
    </div>
  </main>
</div>

<div class="toast" id="toast">Copied</div>

const state = {
  query: "",
  contest: localStorage.getItem("pageantContest") || "Miss Universe",
  copyAllCaps: localStorage.getItem("pageantCopyAllCaps") === "true",
  ranked: [],
  activeIndex: 0
};

const resultsEl = document.getElementById("results");
const searchEl = document.getElementById("search");
const contestEl = document.getElementById("contest");
const toastEl = document.getElementById("toast");
const settingsPanel = document.getElementById("settingsPanel");

contestEl.value = state.contest;
const copyAllCapsEl = document.getElementById('copyAllCaps');
copyAllCapsEl.checked = state.copyAllCaps;
copyAllCapsEl.addEventListener('change', () => {
  state.copyAllCaps = copyAllCapsEl.checked;
  try { localStorage.setItem('pageantCopyAllCaps', String(state.copyAllCaps)); }
  catch { showToast('Setting applies now but could not be saved'); }
});

function personalize(text) {
  const contest = state.contest.trim() || "Miss Universe";
  return text.replace(/Miss Universe/gi, () => contest);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  })[c]);
}

function highlight(text) {
  const safe = escapeHtml(text);
  const q = state.query.trim();
  if (!q) return safe;
  const parts = q.split(/\s+/).filter(Boolean).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!parts.length) return safe;
  return safe.replace(new RegExp(`(${parts.join("|")})`, "gi"), "<mark>$1</mark>");
}

function normalize(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s-]/g, " ").replace(/\s+/g, " ").trim();
}

function scoreEntry(entry, query) {
  let q = normalize(query);
  if (/^(if (you|i) (win|won)|winning|if i win tonight|if you win tonight)$/.test(q)) q = 'winning tonight';
  if (!q) return 0;
  const terms = q.split(" ");
  const topic = normalize(personalize(entry.topic));
  const question = normalize(personalize(entry.question));
  const keywords = entry.keywords.map(normalize);
  const answers = normalize((entry.cleanSentences || entry.sentences).join(" "));
  let score = 0;

  if (topic === q) score += 140;
  else if (topic.startsWith(q)) score += 90;
  else if (topic.includes(q)) score += 65;
  if (keywords.includes(q)) score += 100;
  if (question.includes(q)) score += 48;
  if (answers.includes(q)) score += 12;

  terms.forEach(term => {
    if (topic.split(" ").includes(term)) score += 24;
    if (keywords.some(keyword => keyword === term)) score += 30;
    else if (keywords.some(keyword => keyword.includes(term))) score += 12;
    if (question.split(" ").includes(term)) score += 8;
  });

  const allTermsPresent = terms.every(term => [topic, question, keywords.join(" "), answers].some(field => field.includes(term)));
  return allTermsPresent ? score : 0;
}

function rankResults() {
  const scored = DATA
    .map((entry, order) => ({ entry, order, score: scoreEntry(entry, state.query) }))
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score || a.order - b.order);
  const bestScore = scored[0]?.score || 0;
  const eligible = scored
    .filter(item => item.score >= Math.max(18, bestScore * .25))
    .map(item => item.entry);
  const topics = [...new Set(eligible.map(entry => entry.topicId))].slice(0, 3);
  state.ranked = topics.flatMap(id => DATA.filter(entry => entry.topicId === id));
  state.activeIndex = 0;
}

function renderResults() {
  const q = state.query.trim();
  renderQuickLines();
  if (!q) {
    resultsEl.innerHTML = `
      <div class="empty">
        <strong>What is the topic?</strong>
        Type the main idea from the question to find your strongest answer.
      </div>
    `;
    return;
  }

  if (!state.ranked.length) {
    resultsEl.innerHTML = `<div class="empty"><strong>No strong answer found</strong>Try a shorter or broader topic.</div>`;
    return;
  }

  const entry = state.ranked[state.activeIndex];
  const question = personalize(entry.question);
  const sentences = entry.sentences.map(personalize);
  const hasAlternatives = state.ranked.length > 1;
  resultsEl.innerHTML = `
      <article class="card">
        <div class="card-head">
          <div class="meta">
            <span class="badge">${state.activeIndex === 0 ? 'Top topic match' : 'Alternative answer'}</span>
            <span class="topic">${highlight(entry.topic)}</span>
          </div>
          <div class="question">${highlight(question)}</div>
        </div>

        <div class="sentences">
          ${sentences.map((sentence, idx) => `
            <div class="sentence-row">
              <div class="num" title="${['Introduction','Development','Conclusion'][idx]}">${idx + 1}</div>
              <div class="sentence">${highlight(sentence)}</div>
              <button class="copy-btn" data-copy="${escapeHtml(sentence)}" aria-label="Copy sentence ${idx + 1}" title="Copy sentence ${idx + 1}">▣</button>
            </div>
          `).join("")}
        </div>

        <div class="card-footer">
          <button class="copy-all" data-copy-all="${escapeHtml(sentences.join(" "))}">Copy full 3-sentence answer</button>
          <div class="nav">
            <span class="position">${state.activeIndex + 1} of ${state.ranked.length}</span>
            <button class="prev-btn" ${state.activeIndex === 0 ? "disabled" : ""} aria-label="Previous answer">←</button>
            <button class="next-btn" ${!hasAlternatives || state.activeIndex === state.ranked.length - 1 ? "disabled" : ""} aria-label="Next best answer">→</button>
          </div>
        </div>
      </article>
      ${hasAlternatives ? `<div class="hint">Use the arrow to view the next most relevant answer</div>` : ""}
    `;

  resultsEl.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await copyText(btn.dataset.copy);
      const old = btn.textContent;
      btn.textContent = "✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = old;
        btn.classList.remove("copied");
      }, 900);
    });
  });

  resultsEl.querySelectorAll(".copy-all").forEach(btn => {
    btn.addEventListener("click", async () => {
      await copyText(btn.dataset.copyAll);
      showToast("Full answer copied");
    });
  });

  resultsEl.querySelector(".prev-btn")?.addEventListener("click", () => {
    if (state.activeIndex > 0) { state.activeIndex--; renderResults(); }
  });
  resultsEl.querySelector(".next-btn")?.addEventListener("click", () => {
    if (state.activeIndex < state.ranked.length - 1) { state.activeIndex++; renderResults(); }
  });
}

async function copyText(text) {
  text = state.copyAllCaps ? text.toUpperCase() : text;
  try {
    await navigator.clipboard.writeText(text);
    showToast("Sentence copied");
  } catch {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    const copied = document.execCommand("copy");
    textarea.remove();
    if (!copied) { showToast('Could not copy, please select the text and copy'); throw new Error('Clipboard unavailable'); }
    showToast("Copied");
  }
}

let toastTimer;
function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1100);
}

searchEl.addEventListener("input", e => {
  const wasEmpty = !state.query.trim();
  state.query = e.target.value;
  if (!state.query.trim()) resetTimer();
  else if (wasEmpty) startTimer();
  rankResults();
  renderResults();
});

contestEl.addEventListener("input", e => {
  state.contest = e.target.value || "Miss Universe";
  localStorage.setItem("pageantContest", state.contest);
  renderResults();
});

document.getElementById("settingsButton").addEventListener("click", () => {
  settingsPanel.classList.toggle("open");
  if (settingsPanel.classList.contains("open")) contestEl.focus();
});

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
  if (e.key === "Escape" && document.activeElement === searchEl) {
    searchEl.value = "";
    state.query = "";
    resetTimer();
    rankResults();
    renderResults();
  }
  if (e.key === "ArrowRight" && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && state.activeIndex < state.ranked.length - 1) {
    state.activeIndex++;
    renderResults();
  }
  if (e.key === "ArrowLeft" && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && state.activeIndex > 0) {
    state.activeIndex--;
    renderResults();
  }
});

  'Thank you for this question, it speaks to something I care deeply about',

  'It is an honor to stand on this stage and speak from my heart'
];
const CLOSINGS = [
  'Thank you for listening! Good night!',
  'Thank you Miss Universe',
  'Good night Miss Universe!',
  'Thank you for your time and for hearing my voice',
  'With gratitude and hope, thank you Miss Universe',
  'Thank you everyone, it has been an honor to be here tonight'
];
function renderQuickLines() {
  const panel = document.getElementById('quickLines');
  panel.innerHTML = [['Openings',OPENINGS],['Closings',CLOSINGS]].map(([title,lines]) =>
    `<div><h2>${title} · click to copy</h2>${lines.map(line => `<button class="phrase">${escapeHtml(personalize(line))}</button>`).join('')}</div>`
  ).join('');
  panel.querySelectorAll('button').forEach(button => button.addEventListener('click', async () => {
    await copyText(button.textContent);
    showToast('Copied');
  }));
}
const FINAL_SPEECHES = [{"title":"Showing up anyway","sentences":["I came back as Singapore knowing I could make mistakes and disappoint people who believe in me but I also knew that  staying away would mean never giving myself the chance to try","Tonight I'm proud that I showed up wiht those fears and kept going because whatever happens I want to leave knowing I gave this opportunity my best"]},{"title":"From host to contestant","sentences":["As a host I helped other people have their moment and returning as a contestant meant finding the courage to let myself be seen again even wehn I wasn't sure I'd get everything right","I hope  my return reminds someone watching that you can feel afraid and still take part, you don't have to wait until you feel completely ready"]},{"title":"More than expectations","sentences":["Being one of the favorites means a lot to me but it also brings the fear taht one mistake might let people down and I've had to work through that to stand here tonight","I can't promise a perfect result but I can offer honest effort and the same  care I've always had for this community, that won't change afterward"]},{"title":"A reason to try","sentences":["If someone watching is holding back because they're scared of failing I want them to know that I understand that feeling and I'm standing here with it too rather thna waiting for it to disappear","Give yourself time to prepare ask for help and take that first step  because you deserve the chance to discover what you're capable of doing"]},{"title":"What I will take home","sentences":["Whatever the result tonight I'll take home the fact that I returned worked hard and let myself try even when it would have felt safer to keep supporting everyone else from teh side","I still want to share help and keep getting better because this experience matters  to me beyond winning, I'm grateful I didn't let fear choose for me"]}];
const EXTENDERS = [
  "Tonight every woman standing here has given herself a chance to be heard and I hope we all leave proud that we had the courage to take it",
  "We each have something worth sharing and sometimes seeing one woman step forward is all another woman needs to believe there is room for her too",
  "Whatever happens tonight I hope we carry this confidence beyond the stage and keep making it easier for other women to believe in what they can offer"
];
function renderExtenders() {
  const panel = document.getElementById('extenders');
  panel.innerHTML = `<h2>Extenders · click to copy</h2>` + EXTENDERS.map((text, index) =>
    `<button class="phrase" data-extender="${index}" aria-label="Copy extender ${index + 1}">${escapeHtml(text)}</button>`
  ).join('');
  panel.querySelectorAll('[data-extender]').forEach(button => button.addEventListener('click', async () => {
    await copyText(EXTENDERS[Number(button.dataset.extender)]);
    showToast('Extender copied');
  }));
}
renderExtenders();
function renderFinalSpeeches() {
  const panel = document.getElementById('finalSpeeches');
  panel.innerHTML = `<h2>Final speeches</h2><p>Click each part to copy it separately</p>` + FINAL_SPEECHES.map((speech, index) =>
    `<article class="speech-option"><h3>${index + 1} · ${escapeHtml(speech.title)}</h3>${speech.sentences.map((sentence, part) => `<button class="phrase" data-speech="${index}" data-part="${part}" aria-label="Copy speech ${index + 1}, part ${part + 1}"><span class="speech-label">Part ${part + 1} · Copy</span><span class="speech-line">${escapeHtml(personalize(sentence))}</span></button>`).join('')}</article>`
  ).join('');
  panel.querySelectorAll('[data-speech]').forEach(button => button.addEventListener('click', async () => {
    const speech = FINAL_SPEECHES[Number(button.dataset.speech)];
    const part = Number(button.dataset.part);
    await copyText(personalize(speech.sentences[part]));
    showToast(`Part ${part + 1} copied`);
  }));
}
renderFinalSpeeches();
document.getElementById('showFinalSpeeches').addEventListener('change', event => {
  const visible = event.target.checked;
  document.getElementById('finalSpeeches').hidden = !visible;
  event.target.setAttribute('aria-expanded', String(visible));
});
let timerInterval;
let timerDeadline = 0;
function updateTimer() {
  const seconds = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
  const button = document.getElementById('timer');
  button.textContent = `${seconds}s ↻`;
  button.classList.toggle('urgent', seconds <= 20);
  if (!seconds) { clearInterval(timerInterval); button.textContent = '0s · Time is up ↻'; }
}
function startTimer() {
  clearInterval(timerInterval);
  timerDeadline = Date.now() + 100000;
  document.getElementById('timer').hidden = false;
  updateTimer();
  timerInterval = setInterval(updateTimer, 250);
}
function resetTimer() {
  clearInterval(timerInterval);
  timerDeadline = 0;
  document.getElementById('timer').hidden = true;
}
document.getElementById('timer').addEventListener('click', startTimer);
document.addEventListener('visibilitychange', () => { if (timerDeadline) updateTimer(); });
rankResults();
renderResults();
</script>
